name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that AIM does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: runtime
    attributes:
      label: Agent runtime involved
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Grok Build
        - OpenCode
        - Web console
        - Not runtime-specific
  - type: input
    id: version
    attributes:
      label: Version or commit
