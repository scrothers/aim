version: "3"

includes:
  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web

vars:
  DEV_DIR: "{{.ROOT_DIR}}/.dev"
  DEV_SOCKET: "{{.DEV_DIR}}/aim.sock"
  # Dev services bind 0.0.0.0. These name this host for printed links, TLS
  # SANs and Host/Origin allowlists; override with `task dev LAN_IP=...`.
  LAN_IP:
    sh: hostname -I | awk '{print $1}'
  FQDN:
    sh: hostname -f
  DEV_HTTP_PORT: "17172"
  DEV_MCP_PORT: "17171"
  DEV_WEB_PORT: "17173"
  INSPECTOR_PORT: "6274"
  INSPECTOR_SANDBOX_PORT: "6275"
  # Pinned per run so the printed URL is known up front.
  INSPECTOR_TOKEN:
    sh: openssl rand -hex 24

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  build:
    desc: Build aim into ./bin (with the embedded web UI)
    deps: [web:build]
    cmds:
      - mkdir -p bin
      - go build -o bin/aim ./cmd/aim

  dev:
    desc: Run dev daemon, Vite UI and MCP inspector on 0.0.0.0, printing every link
    deps: [dev:links, dev:daemon, dev:web, dev:inspector]

  dev:links:
    desc: Print every dev URL (localhost, 127.0.0.1, LAN IP, FQDN)
    silent: true
    cmds:
      - |
        hosts="localhost 127.0.0.1 {{.LAN_IP}} {{.FQDN}}"
        echo ""
        echo "AIM web UI, Vite dev server with hot reload:"
        for h in $hosts; do echo "  http://$h:{{.DEV_WEB_PORT}}/"; done
        echo "AIM web UI, embedded in the daemon (run task web:build to refresh):"
        for h in $hosts; do echo "  http://$h:{{.DEV_HTTP_PORT}}/"; done
        echo "REST API docs:"
        for h in $hosts; do echo "  http://$h:{{.DEV_HTTP_PORT}}/docs"; done
        echo "MCP Inspector:"
        for h in $hosts; do echo "  https://$h:{{.INSPECTOR_PORT}}/?MCP_INSPECTOR_API_TOKEN={{.INSPECTOR_TOKEN}}"; done
        echo "MCP endpoint for agents (aim mcp):"
        echo "  AIM_ADDR={{.DEV_SOCKET}}"
        for h in $hosts; do echo "  AIM_ADDR=$h:{{.DEV_MCP_PORT}}"; done
        echo ""

  dev:daemon:
    internal: true
    cmds:
      - mkdir -p {{.DEV_DIR}}
      - >-
        go run ./cmd/aimdev -- daemon
        --db {{.DEV_DIR}}/aim.db
        --socket {{.DEV_SOCKET}}
        --listen 0.0.0.0:{{.DEV_MCP_PORT}}
        --http 0.0.0.0:{{.DEV_HTTP_PORT}}
        --http-allowed-hosts {{.LAN_IP}},{{.FQDN}}
        --log-level debug

  dev:web:
    internal: true
    dir: web
    env:
      AIM_API_TARGET: "http://127.0.0.1:{{.DEV_HTTP_PORT}}"
      AIM_DEV_ALLOWED_HOSTS: "{{.FQDN}}"
    cmds:
      - pnpm exec vite --host 0.0.0.0 --port {{.DEV_WEB_PORT}} --strictPort

  # The inspector UI needs a secure context (crypto.randomUUID), so it is
  # served over HTTPS with a self-signed cert for this host.
  dev:cert:
    internal: true
    vars:
      CERT: "{{.DEV_DIR}}/tls-{{.LAN_IP}}.crt"
      KEY: "{{.DEV_DIR}}/tls-{{.LAN_IP}}.key"
    status:
      - test -f {{.CERT}} && test -f {{.KEY}}
    cmds:
      - mkdir -p {{.DEV_DIR}}
      - >-
        openssl req -x509 -nodes -days 825
        -newkey ec -pkeyopt ec_paramgen_curve:prime256v1
        -keyout {{.KEY}} -out {{.CERT}}
        -subj "/CN={{.FQDN}}"
        -addext "subjectAltName=DNS:{{.FQDN}},DNS:localhost,IP:{{.LAN_IP}},IP:127.0.0.1"
      - chmod 600 {{.KEY}}

  dev:inspector:
    internal: true
    deps: [dev:cert]
    env:
      HOST: "0.0.0.0"
      CLIENT_PORT: "{{.INSPECTOR_PORT}}"
      MCP_SANDBOX_PORT: "{{.INSPECTOR_SANDBOX_PORT}}"
      INSPECTOR_TLS_CERT_PATH: "{{.DEV_DIR}}/tls-{{.LAN_IP}}.crt"
      INSPECTOR_TLS_KEY_PATH: "{{.DEV_DIR}}/tls-{{.LAN_IP}}.key"
      ALLOWED_ORIGINS: >-
        https://{{.LAN_IP}}:{{.INSPECTOR_PORT}},https://{{.FQDN}}:{{.INSPECTOR_PORT}},https://localhost:{{.INSPECTOR_PORT}},https://127.0.0.1:{{.INSPECTOR_PORT}}
      MCP_INSPECTOR_API_TOKEN: "{{.INSPECTOR_TOKEN}}"
      MCP_AUTO_OPEN_ENABLED: "false"
    cmds:
      - >-
        npx -y @modelcontextprotocol/inspector
        --cwd {{.ROOT_DIR}}
        -e AIM_ADDR={{.DEV_SOCKET}}
        go run ./cmd/aim mcp

  dev:seed:
    desc: Seed the dev database with a week of realistic history (safe next to a running daemon)
    cmds:
      - mkdir -p {{.DEV_DIR}}
      - go run ./cmd/aimseed --db {{.DEV_DIR}}/aim.db {{.CLI_ARGS}}

  dev:seed:live:
    desc: Connect ~12 simulated agents to the running dev daemon until Ctrl-C
    cmds:
      - go run ./cmd/aimseed --live --addr {{.DEV_SOCKET}} {{.CLI_ARGS}}

  dev:reset:
    desc: Move the dev database (aim.db*) to the trash; stop the daemon first
    cmds:
      - |
        found=0
        for f in {{.DEV_DIR}}/aim.db {{.DEV_DIR}}/aim.db-wal {{.DEV_DIR}}/aim.db-shm; do
          if [ -e "$f" ]; then
            echo "trashing $f"
            trash-put "$f"
            found=1
          fi
        done
        [ "$found" = 1 ] || echo "nothing to reset in {{.DEV_DIR}}"

  gen:
    desc: Generate sqlc code
    cmds:
      - go tool -modfile=tools/go.mod sqlc generate

  fmt:
    desc: gofmt -s -w
    cmds:
      - gofmt -s -w .

  lint:
    desc: golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix ./...

  test:
    desc: Run unit tests
    cmds:
      - go test -race ./...

  test:e2e:
    desc: Run e2e tests
    cmds:
      - go test -tags=e2e ./test/e2e/...

  e2e:all:
    desc: Build, then run the Go e2e and Playwright suites
    cmds:
      - task: build
      - task: test:e2e
      - task: web:e2e

  cover:
    desc: Coverage report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1
